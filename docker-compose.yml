# Local development services: Postgres + Redis.
# Credentials come from the root .env (copy .env.example to .env first).
# Compose reads ./.env automatically; `${VAR:?msg}` aborts if a variable is missing.
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the DB is not reachable from the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A fake mail server for local development, ONLY when asked: `docker compose --profile mail up -d mailpit`.
  # Set MAIL_TRANSPORT=smtp and SMTP_URL=smtp://localhost:1025 in .env, then read the codes at
  # http://localhost:8025. Nothing is ever delivered to a real address.
  mailpit:
    profiles: ["mail"]
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # The backend itself, ONLY for load tests: `make loadtest-up`. It runs with fixed, stated
  # resources so that "this server spec carries N users" is a measurement and not a guess.
  # Change them with BACKEND_CPUS / BACKEND_MEMORY (see .env.example).
  backend:
    profiles: ["loadtest"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cpus: ${BACKEND_CPUS:-1}
    mem_limit: ${BACKEND_MEMORY:-512m}
    environment:
      # "test", not "production": the fake catalog is refused in production. Nothing else
      # depends on NODE_ENV except pretty-printed logs in development.
      NODE_ENV: test
      LOG_LEVEL: warn
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      # The load generator gives every virtual user its own X-Forwarded-For address, the way
      # real users behind a proxy look, so the per-IP rate limits stay ON during the test.
      TRUST_PROXY: "1"
      # No calls to Deezer during a load test: we measure OUR server.
      CATALOG_PROVIDER: fake
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
