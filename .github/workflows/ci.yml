# Runs on every pull request (and pushes to main/develop): install, lint, typecheck, test.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            mobile/package-lock.json
      - run: make install
      - run: make format-check
      - run: make lint
      - run: make typecheck
      - run: make test
